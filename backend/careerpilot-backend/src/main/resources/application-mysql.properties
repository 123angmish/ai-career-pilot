# Spring Boot MySQL Production Database Configuration
server.port=8080

# File Upload Configuration
file.upload-dir=uploads

# MySQL Database DataSource Settings
spring.datasource.url=jdbc:mysql://localhost:3306/careerpilot_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate MySQL Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security / JWT Keys
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
jwt.expiration=86400000

# Gemini AI API Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
